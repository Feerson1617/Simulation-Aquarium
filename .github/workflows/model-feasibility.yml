name: Aquarium – rekonstruierte Piloten im Spiel prüfen

on:
  push:
    branches: [feature/catalog-ui-realism-review]
    paths:
      - 'tools/realism/review_triposr_candidates.py'
      - '.github/workflows/model-feasibility.yml'

permissions:
  contents: read
  actions: read

jobs:
  runtime-review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Auf die bereits erzeugten Quelldateien warten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 30); do
            found="$(gh api repos/Feerson1617/Simulation-Aquarium/actions/runs/39270664762/artifacts --jq '[.artifacts[] | select(.name == "aquarium-cpu-reconstruction-feasibility")] | length')"
            if test "$found" -gt 0; then break; fi
            sleep 10
          done
          test "$found" -gt 0
      - name: Vorhandene Rekonstruktionen und Referenzbilder laden
        uses: actions/download-artifact@v4
        with:
          name: aquarium-cpu-reconstruction-feasibility
          path: docs/ui-model-review/feasibility
          run-id: 39270664762
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freie Prüfwerkzeuge installieren
        run: |
          python -m pip install numpy==1.26.4 trimesh==4.0.5 Pillow==10.4.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Maßstab, Ausrichtung und echte Spielansichten prüfen
        run: timeout --signal=INT --kill-after=30s 18m python tools/realism/review_triposr_candidates.py
      - name: Browserbilder und geprüfte Modelldateien sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquarium-corrected-runtime-review
          path: docs/ui-model-review/feasibility
          retention-days: 3

  export-reviewed-bytes:
    needs: runtime-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        species: [guppy, cory, anubias]
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquarium-corrected-runtime-review
          path: evidence
      - name: Exakte geprüfte GLB-Bytes für die manuelle Sicherung ausgeben
        env:
          AQUARIUM_MODEL: ${{ matrix.species }}
          AQUARIUM_PART: ${{ matrix.part }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          name, part = os.environ['AQUARIUM_MODEL'], int(os.environ['AQUARIUM_PART'])
          data = (Path('evidence/normalized') / (name + '.glb')).read_bytes()
          start, end = len(data)*part//4, len(data)*(part+1)//4
          encoded = base64.b64encode(data[start:end]).decode()
          print('MODEL_BYTES_META ' + json.dumps({'species':name,'part':part,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          for index in range(0,len(encoded),10000):
              print('MODEL_BYTES ' + name + ' ' + str(part) + ' ' + str(index//10000) + ' ' + encoded[index:index+10000])
          PY
