name: Aquarium – kostenlose CPU-Rekonstruktion prüfen

on:
  push:
    branches: [feature/catalog-ui-realism-review]
    paths:
      - 'tools/realism/triposr_feasibility.py'
      - 'tools/realism/review_triposr_candidates.py'
      - '.github/workflows/model-feasibility.yml'

permissions:
  contents: read
  actions: read

jobs:
  cpu-trial:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unveränderte Kandidaten und Browseraufnahmen wiederverwenden
        uses: actions/download-artifact@v4
        with:
          name: aquarium-corrected-runtime-review
          path: docs/ui-model-review/feasibility
          run-id: 39272907955
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freie Software-Rasterisierung vorbereiten
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1
      - name: Begrenzter Versuch ohne Konten oder APIs
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python tools/realism/triposr_feasibility.py
      - name: Kostenlosen Vergleichsbrowser installieren
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Kandidaten tatsächlich in der Simulation vergleichen
        env:
          AQUARIUM_REVIEW_SPECIES: anubias
        run: timeout --signal=INT --kill-after=30s 12m python tools/realism/review_triposr_candidates.py
      - name: Tatsächliches Ergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquarium-isolated-plant-review
          path: docs/ui-model-review/feasibility
          retention-days: 30
