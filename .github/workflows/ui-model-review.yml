name: Aquarium – HTML-Download prüfen
on:
  push:
    branches: [feature/catalog-ui-realism-review]
    paths:
      - '.github/workflows/ui-model-review.yml'
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kostenlosen Browser installieren
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Heruntergeladene HTML-Datei eigenständig spielen
        run: python tests/standalone_browser.py
