name: Aquarium – UI und Modellprüfung

on:
  pull_request:
    paths:
      - '**.mjs'
      - 'index.html'
      - 'catalog.css'
      - 'tests/**'
      - '.github/workflows/ui-model-review.yml'

permissions:
  contents: read

concurrency:
  group: aquarium-ui-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restliche Farbauswahl und Pinzettenhinweis auslesen
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('index.html').read_text()
          start = source.find('function G1(')
          print('LEGACY COLOR:', source[start:start+2600])
          for match in re.finditer('id="aquascape-instructions"', source):
              print('TOOL INSTRUCTIONS:', source[max(0,match.start()-100):match.start()+1100])
          PY
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: aquarium-simulation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3430325b96c28631964aa23ea051ee2fa4053a1e
          path: aquarium-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kostenlose Browserwerkzeuge installieren
        id: browser_setup
        run: |
          python -m pip install playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - name: Modultests und bestehende Modellvalidierung
        working-directory: aquarium-simulation
        run: |
          node --test tests/*.test.mjs
          python tests/species_assets_test.py
      - name: Desktop, Touchformat und echte Vergleichsaufnahmen
        working-directory: aquarium-simulation
        run: python tests/catalog_ui_browser.py
      - name: Bestehende Pinzettenprüfung
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        working-directory: aquarium-simulation
        env:
          AQUARIUM_TEST_RESULTS: ${{ github.workspace }}/aquarium-simulation/docs/ui-model-review/evidence/aquascaping
        run: python tests/aquascaping_browser.py
      - name: Bestehende Genetik- und Ökosystemprüfungen
        if: always() && steps.browser_setup.outcome == 'success'
        working-directory: aquarium-simulation
        env:
          AQUARIUM_GENETICS_RESULTS: ${{ github.workspace }}/aquarium-simulation/docs/ui-model-review/evidence/genetics
        run: |
          python -m http.server 8000 --directory .. > /tmp/aquarium-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python tests/genetics_browser.py
          python tests/ecosystem_browser.py
      - name: Echte Browsernachweise bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquarium-ui-browser-evidence
          path: aquarium-simulation/docs/ui-model-review/evidence
          retention-days: 3
